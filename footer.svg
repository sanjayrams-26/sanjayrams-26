<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c7ff"/><stop offset="50%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffa3"/><stop offset="50%" stop-color="#00c7ff"/><stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <style>
      .w { animation: drift 14s linear infinite; }
      .w2 { animation: drift2 18s linear infinite; }
      @keyframes drift  { from { transform: translateX(0); } to { transform: translateX(-500px); } }
      @keyframes drift2 { from { transform: translateX(-500px); } to { transform: translateX(0); } }
      .star { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:1 } }
    </style>
  </defs>

  <g fill="#00c7ff">
    <circle class="star" cx="120" cy="34" r="1.8"/>
    <circle class="star" cx="300" cy="20" r="1.4" style="animation-delay:.7s"/>
    <circle class="star" cx="520" cy="40" r="2"   style="animation-delay:1.3s"/>
    <circle class="star" cx="720" cy="18" r="1.5" style="animation-delay:.4s"/>
    <circle class="star" cx="880" cy="36" r="1.8" style="animation-delay:1.8s"/>
  </g>

  <g opacity="0.35">
    <path class="w2" d="M0,95 C125,60 250,125 500,95 C750,65 875,120 1000,95 C1125,70 1250,125 1500,95 L1500,150 L0,150 Z" fill="url(#w2)"/>
  </g>
  <g opacity="0.85">
    <path class="w" d="M0,110 C125,80 250,140 500,110 C750,80 875,140 1000,110 C1125,80 1250,140 1500,110 L1500,150 L0,150 Z" fill="url(#w1)"/>
  </g>
</svg>
