<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Sanjay Ram S — Full Stack Developer, DevOps, AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#0e1a33"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c7ff">
        <animate attributeName="stop-color" values="#00c7ff;#7c5cff;#00ffa3;#00c7ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7c5cff">
        <animate attributeName="stop-color" values="#7c5cff;#00ffa3;#00c7ff;#7c5cff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00ffa3">
        <animate attributeName="stop-color" values="#00ffa3;#00c7ff;#7c5cff;#00ffa3" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a3a5c" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c7ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00c7ff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frame"><rect width="1000" height="280" rx="18"/></clipPath>

    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, monospace; }
      .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }

      .name   { font-size: 54px; font-weight: 800; letter-spacing: -1px; fill: #ffffff; }
      .role   { font-size: 19px; font-weight: 600; fill: #9fb3d1; letter-spacing: 0.5px; }
      .meta   { font-size: 13px; fill: #6f86a8; letter-spacing: 1.6px; }
      .chip   { font-size: 12.5px; font-weight: 600; fill: #cfe3ff; }
      .prompt { font-size: 14px; fill: #00ffa3; }

      .fade1 { opacity: 0; animation: fade .9s ease-out .15s forwards; }
      .fade2 { opacity: 0; animation: fade .9s ease-out .45s forwards; }
      .fade3 { opacity: 0; animation: fade .9s ease-out .75s forwards; }
      .fade4 { opacity: 0; animation: fade .9s ease-out 1.05s forwards; }
      @keyframes fade { to { opacity: 1; transform: translateY(0); } }

      .rise { transform: translateY(14px); }

      .caret { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .sheen-bar { animation: sweep 6s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-420px); } 55%,100% { transform: translateX(1100px); } }

      .float-a { animation: fa 7s ease-in-out infinite; }
      .float-b { animation: fb 9s ease-in-out infinite; }
      @keyframes fa { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes fb { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }

      .pulse { animation: pu 3.2s ease-in-out infinite; transform-origin: center; }
      @keyframes pu { 0%,100% { opacity:.35; } 50% { opacity:1; } }

      .underline { animation: grow 1.6s cubic-bezier(.2,.8,.2,1) .9s forwards; }
      @keyframes grow { to { width: 330px; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <ellipse cx="820" cy="60" rx="300" ry="190" fill="url(#glow)"/>
    <ellipse cx="90" cy="250" rx="240" ry="150" fill="url(#glow)" opacity="0.5"/>

    <!-- constellation -->
    <g stroke="#3a5a8c" stroke-width="0.9" stroke-opacity="0.5">
      <line x1="700" y1="70" x2="790" y2="120"/>
      <line x1="790" y1="120" x2="880" y2="85"/>
      <line x1="880" y1="85" x2="930" y2="160"/>
      <line x1="790" y1="120" x2="840" y2="205"/>
      <line x1="840" y1="205" x2="930" y2="160"/>
      <line x1="700" y1="70" x2="740" y2="185"/>
      <line x1="740" y1="185" x2="840" y2="205"/>
    </g>
    <g fill="#00c7ff">
      <circle class="pulse" cx="700" cy="70"  r="3.4"/>
      <circle class="pulse" cx="790" cy="120" r="4.6" style="animation-delay:.4s"/>
      <circle class="pulse" cx="880" cy="85"  r="3.4" style="animation-delay:.9s"/>
      <circle class="pulse" cx="930" cy="160" r="4"   style="animation-delay:1.4s" fill="#7c5cff"/>
      <circle class="pulse" cx="840" cy="205" r="3.4" style="animation-delay:.6s" fill="#00ffa3"/>
      <circle class="pulse" cx="740" cy="185" r="3"   style="animation-delay:1.9s"/>
    </g>

    <!-- travelling packet -->
    <circle r="3.2" fill="#00ffa3">
      <animateMotion dur="5s" repeatCount="indefinite"
        path="M700,70 L790,120 L880,85 L930,160 L840,205 L740,185 L700,70"/>
    </circle>

    <!-- accent rail -->
    <rect x="52" y="58" width="4" height="150" rx="2" fill="url(#accent)"/>

    <!-- prompt line -->
    <g class="fade1 rise">
      <text class="mono prompt" x="76" y="70">~/sanjayrams-26 $ whoami</text>
    </g>

    <!-- name -->
    <g class="fade2 rise">
      <text class="sans name" x="74" y="128">Sanjay Ram S</text>
      <rect class="underline" x="74" y="142" width="0" height="4" rx="2" fill="url(#accent)"/>
    </g>

    <!-- role -->
    <g class="fade3 rise">
      <text class="sans role" x="76" y="178">
        Full Stack Developer<tspan fill="#41577a"> · </tspan>DevOps<tspan fill="#41577a"> · </tspan>AI Systems<tspan class="caret" fill="#00ffa3">_</tspan>
      </text>
    </g>

    <!-- meta -->
    <g class="fade4 rise">
      <text class="mono meta" x="76" y="206">B.E. CSE · CGPA 8.70 · AWS CLOUD PRACTITIONER</text>
    </g>

    <!-- chips -->
    <g class="fade4">
      <g class="float-a">
        <rect x="76" y="226" width="74" height="26" rx="13" fill="#132445" stroke="#274470"/>
        <text class="mono chip" x="94" y="243">React</text>
      </g>
      <g class="float-b">
        <rect x="160" y="226" width="78" height="26" rx="13" fill="#132445" stroke="#274470"/>
        <text class="mono chip" x="177" y="243">Node.js</text>
      </g>
      <g class="float-a" style="animation-delay:1s">
        <rect x="248" y="226" width="86" height="26" rx="13" fill="#132445" stroke="#274470"/>
        <text class="mono chip" x="263" y="243">MongoDB</text>
      </g>
      <g class="float-b" style="animation-delay:.6s">
        <rect x="344" y="226" width="74" height="26" rx="13" fill="#132445" stroke="#274470"/>
        <text class="mono chip" x="362" y="243">Docker</text>
      </g>
      <g class="float-a" style="animation-delay:1.8s">
        <rect x="428" y="226" width="60" height="26" rx="13" fill="#132445" stroke="#274470"/>
        <text class="mono chip" x="447" y="243">AWS</text>
      </g>
      <g class="float-b" style="animation-delay:1.3s">
        <rect x="498" y="226" width="72" height="26" rx="13" fill="#132445" stroke="#274470"/>
        <text class="mono chip" x="514" y="243">Python</text>
      </g>
    </g>

    <!-- sheen sweep -->
    <rect class="sheen-bar" x="0" y="0" width="260" height="280" fill="url(#sheen)" transform="skewX(-18)"/>

    <!-- border -->
    <rect x="1" y="1" width="998" height="278" rx="18" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.75"/>
  </g>
</svg>
