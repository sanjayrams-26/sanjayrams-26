<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 14" width="1000" height="14" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00c7ff" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#00c7ff" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#7c5cff" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#00ffa3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ffa3" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;0;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1"  dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6" width="1000" height="2" rx="1" fill="url(#d)"/>
  <circle cy="7" r="3.5" fill="#00ffa3">
    <animate attributeName="cx" values="0;1000;0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
