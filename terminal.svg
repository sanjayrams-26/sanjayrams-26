<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="Terminal: about Sanjay Ram S" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1426"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c7ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <clipPath id="tclip"><rect width="560" height="330" rx="14"/></clipPath>
    <style>
      .m { font-family: "SFMono-Regular","JetBrains Mono","Fira Code",Consolas,monospace; font-size: 13.5px; }
      .k { fill: #7c5cff; } .s { fill: #00ffa3; } .c { fill: #5b7196; }
      .v { fill: #cfe3ff; } .p { fill: #00c7ff; } .t { fill: #ffb86b; }
      .ln { opacity: 0; animation: in .01s linear forwards; }
      @keyframes in { to { opacity: 1; } }
      .cur { animation: bl 1s steps(1) infinite; }
      @keyframes bl { 50% { opacity: 0; } }
      .barfill { animation: fill 2.4s cubic-bezier(.2,.8,.2,1) 2.2s forwards; }
      @keyframes fill { to { width: 300px; } }
    </style>
  </defs>

  <g clip-path="url(#tclip)">
    <rect width="560" height="330" fill="url(#tbg)"/>
    <rect width="560" height="34" fill="#121b31"/>
    <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
    <circle cx="40" cy="17" r="5.5" fill="#febc2e"/>
    <circle cx="60" cy="17" r="5.5" fill="#28c840"/>
    <text class="m c" x="200" y="22">sanjay@dev — zsh</text>

    <g class="m">
      <text class="ln p" x="20" y="62" style="animation-delay:.2s">$ cat profile.json</text>

      <text class="ln v" x="20" y="88"  style="animation-delay:.5s">{</text>
      <text class="ln"   x="34" y="110" style="animation-delay:.7s"><tspan class="k">"focus"</tspan><tspan class="v">: </tspan><tspan class="s">"MERN · DevOps · AI/ML"</tspan><tspan class="v">,</tspan></text>
      <text class="ln"   x="34" y="132" style="animation-delay:.9s"><tspan class="k">"building"</tspan><tspan class="v">: </tspan><tspan class="s">"SentinelX — AI SOC"</tspan><tspan class="v">,</tspan></text>
      <text class="ln"   x="34" y="154" style="animation-delay:1.1s"><tspan class="k">"learning"</tspan><tspan class="v">: </tspan><tspan class="s">"System Design, K8s"</tspan><tspan class="v">,</tspan></text>
      <text class="ln"   x="34" y="176" style="animation-delay:1.3s"><tspan class="k">"solved"</tspan><tspan class="v">: </tspan><tspan class="t">1250</tspan><tspan class="v">,</tspan></text>
      <text class="ln"   x="34" y="198" style="animation-delay:1.5s"><tspan class="k">"openTo"</tspan><tspan class="v">: </tspan><tspan class="s">"internships, open source"</tspan></text>
      <text class="ln v" x="20" y="220" style="animation-delay:1.7s">}</text>

      <text class="ln p" x="20" y="252" style="animation-delay:2.0s">$ ./ship.sh --prod</text>
      <text class="ln c" x="20" y="300" style="animation-delay:4.7s">✔ deployed<tspan class="cur s"> ▊</tspan></text>
    </g>

    <rect x="20" y="266" width="300" height="9" rx="4.5" fill="#1b2846"/>
    <rect class="barfill" x="20" y="266" width="0" height="9" rx="4.5" fill="url(#bar)"/>

    <rect x="1" y="1" width="558" height="328" rx="14" fill="none" stroke="#243a63" stroke-width="1"/>
  </g>
</svg>
